<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf2e3">
  <title>Book an Event — MARVIN Studio</title>
  <meta name="description" content="Explore MARVIN Studio experiences, captured in motion.">
  <link rel="stylesheet" href="book-event.css?v=wider-preview-25">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="MARVIN Studio home">
      <img src="assets/marvin-logo-lossless.webp" alt="MARVIN" width="1788" height="648">
    </a>
    <details class="site-menu">
      <summary aria-label="Navigation menu"><span></span><span></span><span></span></summary>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="book-session.html">Book a Session</a>
        <a href="book-event.html" aria-current="page">Book an Event</a>
      </nav>
    </details>
  </header>
  <main>
    <section class="motion" aria-labelledby="motion-title">
      <svg class="motion__curve" viewBox="0 0 836 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 64C0 32 110 8 230 8C370 8 540 46 680 46C760 46 836 24 836 64Z"/></svg>
      <div class="motion__intro">
        <p class="motion__eyebrow">MARVIN IN MOTION </p>
        <h1 id="motion-title">Events, captured<br>in motion.</h1>
        <svg class="motion__underline" viewBox="0 0 280 26" fill="none" aria-hidden="true"><path d="M3 21Q120-1 270 9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      </div>
      <div class="film-carousel" id="event-films" role="region" aria-label="Event films" tabindex="0">
<article class="featured-film" aria-label="Wedding event film">
        <div class="film-stage">
          <button class="film-arrow film-arrow--previous" type="button" aria-label="Previous film" aria-controls="event-films"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="featured-film__media featured-film_media">
          <video id="featured-film-video" class="featured-film__video" width="720" height="1280" controls playsinline preload="metadata" poster="assets/preview-img-billywedding.jpg" aria-label="MARVIN Studio wedding event film">
            <source src="assets/wedding-billy.mp4" type="video/mp4">
            Your browser does not support embedded video. <a href="assets/wedding-billy.mp4">Watch the film</a>.
          </video>
          <span class="featured-film__badge">EVENT FILM</span>
          <button class="play-symbol" type="button" aria-label="Play wedding event film" aria-controls="featured-film-video" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 6 26 16 11 26Z"/></svg></button>
        </div>
          <button class="film-arrow film-arrow--next" type="button" aria-label="Next film" aria-controls="event-films"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <p class="film-status" role="status" hidden></p>
        <div class="featured-film__caption">
          <div>
            <h2>BILLY’S WEDDING</h2>
            <p>Wedding · MARVIN Studio</p>
          </div>
          <button class="watch-film" type="button" aria-controls="featured-film-video">WATCH FILM <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 12h17M13 5l7 7-7 7"/></svg></button>
        </div>
      </article>
<article class="featured-film" aria-label="IKEA event film">
        <div class="film-stage">
          <button class="film-arrow film-arrow--previous" type="button" aria-label="Previous film" aria-controls="event-films"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="featured-film__media featured-film_media">
          <video poster="assets/ikea-poster.jpg" id="ikea-film-video" class="featured-film__video" width="720" height="1280" controls playsinline preload="metadata" aria-label="MARVIN Studio IKEA event film">
            <source src="assets/ikea.mp4" type="video/mp4">
            Your browser does not support embedded video. <a href="assets/ikea.mp4">Watch the film</a>.
          </video>
          <span class="featured-film__badge">EVENT FILM</span>
          <button class="play-symbol" type="button" aria-label="Play IKEA event film" aria-controls="ikea-film-video" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 6 26 16 11 26Z"/></svg></button>
        </div>
          <button class="film-arrow film-arrow--next" type="button" aria-label="Next film" aria-controls="event-films"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <p class="film-status" role="status" hidden></p>
        <div class="featured-film__caption">
          <div>
            <h2>IKEA</h2>
            <p>Event · MARVIN Studio</p>
          </div>
          <button class="watch-film" type="button" aria-controls="ikea-film-video">WATCH FILM <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 12h17M13 5l7 7-7 7"/></svg></button>
        </div>
      </article>
      </div>

    </section>

    <section class="memory-strip" aria-label="MARVIN event photo memories">
      <div class="memory-strip__reel">
        <figure class="memory-strip__frame"><img src="assets/03-4r-hero.png" alt="MARVIN photo keepsake" loading="lazy" style="object-position: 35% 38%"></figure>
        <figure class="memory-strip__frame"><img src="assets/preview-img-billywedding.jpg" alt="Guests with their MARVIN keepsakes" loading="lazy" style="object-position: center 65%"></figure>
        <figure class="memory-strip__frame"><img src="assets/02-mini-tote-hero.png" alt="Mini tote photobooth memories" loading="lazy" style="object-position: 32% 42%"></figure>
        <figure class="memory-strip__frame"><img src="assets/ikea-poster.jpg" alt="MARVIN at the IKEA event" loading="lazy" style="object-position: center 45%"></figure>
      </div>
      <div class="memory-strip__reel">
        <figure class="memory-strip__frame"><img src="assets/wedding-billy-poster.jpg" alt="A moment from the wedding" loading="lazy" style="object-position: center 50%"></figure>
        <figure class="memory-strip__frame"><img src="assets/01-xl-strip-hero.png" alt="XL photo strip keepsake" loading="lazy" style="object-position: 52% 42%"></figure>
        <figure class="memory-strip__frame"><img src="assets/03-4r-hero.png" alt="A photo to remember" loading="lazy" style="object-position: 35% 49%"></figure>
        <figure class="memory-strip__frame"><img src="assets/preview-img-billywedding.jpg" alt="Wedding guests celebrating together" loading="lazy" style="object-position: center 65%"></figure>
      </div>
    </section>
  </main>
  <script src="featured-film.js?v=carousel-arrows-4" defer></script>
</body>
</html>
